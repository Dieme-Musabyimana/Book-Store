trigger:
- master

pool:
  name: Default  # This tells it to use your PACCY AGENT

steps:
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(build.sourcesDirectory)'
    includeRootFolder: false

- task: PublishBuildArtifacts@1

# THE MISSING TEST STEP (Matching the Troubleshooting Guide)
- task: CmdLine@2
  displayName: 'Run tests'
  inputs:
    script: 'call npm test'  # MUST use 'call' for Windows
    workingDirectory: '$(System.DefaultWorkingDirectory)/abs' #
  env:
    APPLITOOLS_API_KEY: $(Applitools_API_Key) # Maps your secret variable